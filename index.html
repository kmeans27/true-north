<!doctype html>
<html lang="en-GB" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EFE3C8" />
    <title>True North — the daily chart</title>
    <meta
      name="description"
      content="One hand-drawn sea chart a day. Five things are left to your eye. No rulers. No numbers. One score — how many leagues off course you were."
    />
    <meta property="og:title" content="True North — the daily chart" />
    <meta
      property="og:description"
      content="Fix today's chart by eye, sign it, and find out how far off you were. One chart a day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="canonical" href="https://truenorth.day/" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <noscript>
      <p class="noscript">
        True North needs JavaScript. There are no accounts and nothing leaves your
        browser, so there is nothing to sign up for once it loads.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
